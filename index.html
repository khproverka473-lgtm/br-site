<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>BR — скачать видео из TikTok</title>
<meta name="description" content="Скачивай видео из TikTok без водяного знака">
<link rel="icon" href="data:,">
<style>
  :root{
    --bg-1:#181129;
    --bg-2:#2c1f52;
    --blob-blue:#4f7cff;
    --blob-pink:#ff6fae;
    --blob-teal:#34e0d0;
    --glass:rgba(255,255,255,0.10);
    --glass-strong:rgba(255,255,255,0.16);
    --glass-border:rgba(255,255,255,0.32);
    --text:#f6f4ff;
    --text-dim:rgba(246,244,255,0.62);
    --accent-a:#8b7bff;
    --accent-b:#34e0d0;
    --danger:#ff8a8a;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg-1);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }

  body{
    position:relative;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:
      max(24px, env(safe-area-inset-top))
      max(18px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(18px, env(safe-area-inset-left));
  }

  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(circle at 18% 8%, rgba(79,124,255,0.55), transparent 55%),
      radial-gradient(circle at 82% 14%, rgba(255,111,174,0.35), transparent 50%),
      radial-gradient(circle at 30% 92%, rgba(52,224,208,0.30), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, #120c22 100%);
    overflow:hidden;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    animation:drift 22s ease-in-out infinite alternate;
  }
  .blob.b1{width:280px;height:280px; background:var(--blob-blue); top:-60px; left:-70px; animation-duration:26s;}
  .blob.b2{width:240px;height:240px; background:var(--blob-pink); top:40%; right:-90px; animation-duration:20s;}
  .blob.b3{width:260px;height:260px; background:var(--blob-teal); bottom:-90px; left:10%; animation-duration:24s;}

  @keyframes drift{
    from{ transform:translate(0,0) scale(1); }
    to{ transform:translate(24px,-28px) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce){
    .blob{animation:none;}
  }

  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
    display:flex;
    flex-direction:column;
    min-height:calc(100vh - 52px);
    min-height:calc(100dvh - 52px);
  }

  header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-top:8px;
    margin-bottom:28px;
  }

  .logo-badge{
    width:64px;
    height:64px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg, rgba(255,255,255,0.28), rgba(255,255,255,0.06));
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 8px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .logo-badge span{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.5px;
    background:linear-gradient(135deg, #ffffff, var(--accent-b));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header h1{
    margin:10px 0 0;
    font-size:15px;
    font-weight:600;
    color:var(--text-dim);
    text-align:center;
    letter-spacing:0.1px;
  }

  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:28px;
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    padding:20px;
  }

  .input-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:18px;
    padding:6px 6px 6px 16px;
  }
  .input-row input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:16px;
    padding:12px 0;
  }
  .input-row input::placeholder{ color:rgba(246,244,255,0.42); }

  .paste-btn{
    flex-shrink:0;
    border:none;
    background:var(--glass-strong);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    padding:10px 14px;
    border-radius:14px;
    backdrop-filter:blur(10px);
  }
  .paste-btn:active{ transform:scale(0.95); }

  .primary-btn{
    width:100%;
    margin-top:14px;
    border:none;
    border-radius:20px;
    padding:16px;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.2px;
    color:#131022;
    background:linear-gradient(135deg, var(--accent-b), var(--accent-a));
    box-shadow:0 8px 24px rgba(139,123,255,0.35);
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  .primary-btn:active{ transform:scale(0.97); }
  .primary-btn:disabled{ opacity:0.5; }

  .hint{
    margin:12px 2px 0;
    font-size:12.5px;
    color:var(--text-dim);
    text-align:center;
  }
  .error{
    margin-top:12px;
    padding:12px 14px;
    border-radius:14px;
    background:rgba(255,90,90,0.12);
    border:1px solid rgba(255,90,90,0.3);
    color:var(--danger);
    font-size:13.5px;
    display:none;
  }
  .error.show{ display:block; }

  .progress-card{
    margin-top:16px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:26px 20px;
  }
  .progress-card.show{ display:flex; }

  .emoji-ring{
    font-size:30px;
    letter-spacing:6px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35));
  }
  .emoji-ring span{
    display:inline-block;
    opacity:0.25;
    transform:scale(0.85);
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .emoji-ring span.active{
    opacity:1;
    transform:scale(1.15);
  }

  .progress-pct{
    font-size:22px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .progress-label{
    font-size:12.5px;
    color:var(--text-dim);
  }
  .progress-track{
    width:100%;
    height:6px;
    border-radius:6px;
    background:rgba(255,255,255,0.12);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:6px;
    background:linear-gradient(90deg, var(--accent-b), var(--accent-a));
    transition:width 0.25s ease;
  }

  .result-card{
    margin-top:16px;
    display:none;
    gap:14px;
    padding:18px;
  }
  .result-card.show{ display:flex; }
  .result-thumb{
    width:76px;
    height:76px;
    border-radius:16px;
    object-fit:cover;
    background:rgba(255,255,255,0.08);
    flex-shrink:0;
  }
  .result-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
  }
  .result-title{
    font-size:13.5px;
    color:var(--text);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .download-link{
    text-decoration:none;
    text-align:center;
    font-size:14px;
    font-weight:700;
    color:#131022;
    background:linear-gradient(135deg, var(--accent-b), var(--accent-a));
    padding:10px 14px;
    border-radius:14px;
  }

  footer{
    margin-top:auto;
    padding-top:34px;
    text-align:center;
  }
  footer p{
    margin:0;
    font-size:13px;
    color:rgba(246,244,255,0.45);
    font-style:italic;
    letter-spacing:0.2px;
  }
</style>
</head>
<body>

  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="app">
    <header>
      <div class="logo-badge"><span>BR</span></div>
      <h1>Скачивай видео из TikTok без водяного знака</h1>
    </header>

    <div class="card">
      <div class="input-row">
        <input id="url-input" type="url" inputmode="url" placeholder="Вставь ссылку на видео TikTok" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="paste-btn" id="paste-btn" type="button">Вставить</button>
      </div>
      <button class="primary-btn" id="download-btn" type="button">Скачать видео</button>
      <p class="hint">Работает на iPhone и Android — просто вставь ссылку и нажми «Скачать»</p>
      <div class="error" id="error-box"></div>
    </div>

    <div class="card progress-card" id="progress-card">
      <div class="emoji-ring" id="emoji-ring">
        <span>✌️</span><span>🤙</span><span>✌️</span><span>🤙</span><span>✌️</span><span>🤙</span><span>✌️</span>
      </div>
      <div class="progress-pct" id="progress-pct">0%</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label">Обрабатываем видео…</div>
    </div>

    <div class="card result-card" id="result-card">
      <img class="result-thumb" id="result-thumb" alt="">
      <div class="result-info">
        <div class="result-title" id="result-title"></div>
        <a class="download-link" id="result-link" href="#" download target="_blank" rel="noopener">Сохранить видео</a>
      </div>
    </div>

    <footer>
      <p>Դե 1000 դրամ կտաս ախպերս ✌️</p>
    </footer>
  </div>

<script>
(function(){
  const urlInput = document.getElementById('url-input');
  const pasteBtn = document.getElementById('paste-btn');
  const downloadBtn = document.getElementById('download-btn');
  const errorBox = document.getElementById('error-box');
  const progressCard = document.getElementById('progress-card');
  const resultCard = document.getElementById('result-card');
  const progressPct = document.getElementById('progress-pct');
  const progressFill = document.getElementById('progress-fill');
  const emojiSpans = document.querySelectorAll('#emoji-ring span');
  const resultThumb = document.getElementById('result-thumb');
  const resultTitle = document.getElementById('result-title');
  const resultLink = document.getElementById('result-link');

  let emojiIndex = 0;
  let emojiTimer = null;
  let progressTimer = null;
  let currentPct = 0;

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function hideError(){
    errorBox.classList.remove('show');
  }

  pasteBtn.addEventListener('click', async () => {
    try{
      const text = await navigator.clipboard.readText();
      if(text){ urlInput.value = text.trim(); }
    }catch(e){
      urlInput.focus();
    }
  });

  function startEmojiCycle(){
    emojiIndex = 0;
    emojiTimer = setInterval(() => {
      emojiSpans.forEach(s => s.classList.remove('active'));
      emojiSpans[emojiIndex % emojiSpans.length].classList.add('active');
      emojiIndex++;
    }, 260);
  }
  function stopEmojiCycle(){
    clearInterval(emojiTimer);
    emojiSpans.forEach(s => s.classList.remove('active'));
  }

  function startProgress(){
    currentPct = 0;
    progressPct.textContent = '0%';
    progressFill.style.width = '0%';
    progressTimer = setInterval(() => {
      if(currentPct < 90){
        currentPct += Math.random() * 6;
        if(currentPct > 90) currentPct = 90;
        progressPct.textContent = Math.floor(currentPct) + '%';
        progressFill.style.width = currentPct + '%';
      }
    }, 220);
  }
  function finishProgress(){
    clearInterval(progressTimer);
    currentPct = 100;
    progressPct.textContent = '100%';
    progressFill.style.width = '100%';
  }

  function isLikelyTikTokUrl(v){
    return /tiktok\.com|vt\.tiktok|vm\.tiktok/i.test(v);
  }

  downloadBtn.addEventListener('click', async () => {
    hideError();
    resultCard.classList.remove('show');
    const link = urlInput.value.trim();

    if(!link){
      showError('Вставь ссылку на видео из TikTok');
      return;
    }
    if(!isLikelyTikTokUrl(link)){
      showError('Похоже, это не ссылка на TikTok. Проверь и попробуй снова');
      return;
    }

    downloadBtn.disabled = true;
    progressCard.classList.add('show');
    startEmojiCycle();
    startProgress();

    try{
      const res = await fetch('/.netlify/functions/download?url=' + encodeURIComponent(link));
      const data = await res.json();

      if(!res.ok || !data.success){
        throw new Error(data.error || 'Не удалось получить видео. Попробуй другую ссылку');
      }

      finishProgress();
      stopEmojiCycle();

      setTimeout(() => {
        progressCard.classList.remove('show');
        resultThumb.src = data.thumbnail || '';
        resultTitle.textContent = data.title || 'Готово к сохранению';
        resultLink.href = data.videoUrl;
        resultCard.classList.add('show');
      }, 300);

    }catch(err){
      clearInterval(progressTimer);
      stopEmojiCycle();
      progressCard.classList.remove('show');
      showError(err.message || 'Что-то пошло не так. Попробуй ещё раз');
    }finally{
      downloadBtn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
