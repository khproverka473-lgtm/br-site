    <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>BR</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg-0:#000000;
    --bg-1:#0c0c0d;
    --bg-2:#1c1c1e;
    --glass:rgba(255,255,255,0.06);
    --glass-strong:rgba(255,255,255,0.12);
    --glass-border:rgba(255,255,255,0.16);
    --text:#f2f2f2;
    --text-dim:rgba(242,242,242,0.45);
    --silver-a:#e8e8ea;
    --silver-b:#8a8a90;
    --danger:#ff6b6b;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg-0);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }

  body{
    position:relative;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:
      max(24px, env(safe-area-inset-top))
      max(18px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(18px, env(safe-area-inset-left));
  }

  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.10), transparent 55%),
      radial-gradient(circle at 85% 20%, rgba(255,255,255,0.06), transparent 50%),
      radial-gradient(circle at 30% 95%, rgba(255,255,255,0.05), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, #000000 100%);
    overflow:hidden;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.5;
    background:radial-gradient(circle, rgba(255,255,255,0.35), transparent 70%);
    animation:drift 24s ease-in-out infinite alternate;
  }
  .blob.b1{width:280px;height:280px; top:-70px; left:-70px; animation-duration:27s;}
  .blob.b2{width:240px;height:240px; top:42%; right:-100px; animation-duration:21s;}
  .blob.b3{width:260px;height:260px; bottom:-100px; left:8%; animation-duration:25s;}

  @keyframes drift{
    from{ transform:translate(0,0) scale(1); }
    to{ transform:translate(22px,-26px) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce){
    .blob{animation:none;}
  }

  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
  }

  .logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .logo-badge{
    width:78px;
    height:78px;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg, rgba(255,255,255,0.20), rgba(255,255,255,0.03));
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px) saturate(120%);
    -webkit-backdrop-filter:blur(20px) saturate(120%);
    box-shadow:0 10px 34px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .logo-badge span{
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.5px;
    background:linear-gradient(135deg, var(--silver-a), var(--silver-b));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .logo-tag{
    font-size:12.5px;
    color:var(--text-dim);
    letter-spacing:0.3px;
  }

  .card{
    width:100%;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:26px;
    backdrop-filter:blur(24px) saturate(130%);
    -webkit-backdrop-filter:blur(24px) saturate(130%);
    box-shadow:0 10px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
    padding:10px;
  }

  .input-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:18px;
    padding:6px 6px 6px 18px;
    transition:box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .input-row.error{
    border-color:rgba(255,107,107,0.55);
    box-shadow:0 0 0 3px rgba(255,107,107,0.12);
  }
  .input-row input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:16px;
    padding:13px 0;
  }
  .input-row input::placeholder{ color:rgba(242,242,242,0.28); }
